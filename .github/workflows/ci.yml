name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: python -m py_compile $(find . -name '*.py')
