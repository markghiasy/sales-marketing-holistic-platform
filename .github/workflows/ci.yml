name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: python -m py_compile $(find . -name '*.py')

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: comms
          POSTGRES_PASSWORD: comms
          POSTGRES_DB: comms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      - run: for f in db/migrations/*.sql; do PGPASSWORD=comms psql -h localhost -U comms -d comms -f "$f"; done
      - run: pytest -v
