<!--
  Unified inbox — Block C triage inbox (Linear STU-131), built on top of
  the 2026-09-14 demo prototype for Mark (STU-197). Real data as of
  2026-09-16: see docs/superpowers/specs/2026-09-16-triage-inbox-real-data-llm-design.md
  and the implementation plan at
  docs/superpowers/plans/2026-09-16-triage-inbox-real-data-llm.md.

  Data flow: this page fetches /inbox/conversations.json for the list and
  /inbox/conversation/<person_key>.json for the detail panel — both
  backed by adapters/inbox_query.py, reading real message/identity/
  thread/fact data. `summary`/`context`/`topic`/`graph`/`urgency` come
  from adapters/ai_brief.py's precomputed per-contact LLM brief (cached
  in the `ai_brief` table, refreshed after every channel sync — never
  called live from this page). A contact with no `ai_brief` row yet
  (e.g. a brand-new contact ahead of the next sync's precompute step)
  falls back to their latest raw message text as the list preview, and a
  placeholder Context/Network state in the detail panel.

  Still NOT built, by design (see the design doc's Scope section):
    - Real draft replies. The "Draft ready" badge/filter and the detail
      panel's AI draft section stay in the UI but are permanently inert
      this pass — no field ever makes a row's `has_draft` true, and the
      draft section always shows "Draft replies — under development."
      That's the next phase (the project-management/action layer), not
      this one.
    - Actually sending anything — "Use this draft" doesn't exist yet.
    - The top search bar's real semantic search (still visual-only); the
      assistant overlay's greeting stats are real (CONVERSATIONS-derived)
      but its suggestions/input still do nothing.
    - Network graph relationships beyond what the LLM can point to in
      real message text or a `fact` row — it will not invent a
      relationship the way earlier mock data did.
-->
<title>Inbox</title>
<style>
  :root {
    /* Light app theme — matches kinso's actual product screenshot
       (their marketing SITE is dark, but the app mockup inside it is
       light/white). */
    --bg: #ffffff;
    --panel: #f7f8fa;
    --panel-2: #eef0f3;
    --border: #e5e8ec;
    --text: #1c1f23;
    --text-dim: #7d8590;
    --accent: #e8825a;
    --accent-2: #3d9e6f;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app { height: 100vh; display: flex; min-height: 0; }

  /* left icon rail */
  .rail {
    width: 56px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 10px;
    flex-shrink: 0;
  }
  .rail button {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .rail button svg { width: 18px; height: 18px; }
  .rail button:not(.active) svg[fill]:not([fill="currentColor"]) { opacity: 0.55; filter: grayscale(1); }
  .rail button.active {
    background: var(--panel-2);
    border-color: var(--border);
    color: var(--accent);
  }

  /* main column */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .searchbar {
    margin: 16px 20px 8px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: text;
    color: var(--text-dim);
    font-size: 13px;
    display: flex; align-items: center; gap: 8px;
  }
  .searchbar .dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    flex-shrink: 0;
  }
  .content { flex: 1; display: flex; overflow: hidden; padding: 0 20px 20px; gap: 16px; }

  .list-panel { flex: 1; min-width: 0; overflow-y: auto; }
  .list-panel h2 { font-size: 15px; margin: 4px 0 12px; color: var(--text); }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .row:hover { background: var(--panel); }
  .draft-badge {
    background: #eef6ff; color: #2f6fb2; border: 1px solid #cfe4fb;
    font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 20px;
    white-space: nowrap;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: #fff;
    flex-shrink: 0;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-top { display: flex; align-items: baseline; gap: 8px; }
  .row-name { font-weight: 600; font-size: 13.5px; }
  .row-time { font-size: 11px; color: var(--text-dim); margin-left: auto; }
  .row-preview { font-size: 12.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 20px;
    font-size: 10.5px; font-weight: 600; margin-right: 6px;
    white-space: nowrap;
  }
  .channel-icon { flex-shrink: 0; display: flex; }
  .channel-icon svg { width: 15px; height: 15px; }

  /* right filter + AI panel */
  .side-panel { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; overflow-x: hidden; }
  .filter-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px;
  }
  .filter-box h3 { font-size: 10.5px; letter-spacing: 0.06em; color: var(--text-dim); margin: 0 0 8px; text-transform: uppercase; }
  .filter-box h3.spaced { margin-top: 14px; }
  .filter-box label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; cursor: pointer; }

  /* Cascading/staggered stack, like kinso's floating suggestion cards —
     each card nudged right + slightly rotated instead of a plain flush
     vertical list, with a real shadow so they read as "floating". */
  .ai-cards { display: flex; flex-direction: column; gap: 14px; padding: 2px 4px 2px 0; }
  .ai-card {
    position: relative;
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 26px 12px 12px; font-size: 12.5px;
    box-shadow: 0 6px 16px rgba(20,20,30,0.08);
    transition: transform 0.15s ease;
  }
  .ai-card:nth-child(1) { transform: rotate(0deg) translateX(0); }
  .ai-card:nth-child(2) { transform: rotate(0.6deg) translateX(8px); }
  .ai-card:nth-child(3) { transform: rotate(-0.5deg) translateX(14px); }
  .ai-card:hover { transform: translateX(0) rotate(0deg); }
  .ai-card.top { border-color: var(--accent); border-left-width: 3px; box-shadow: 0 8px 20px rgba(232,130,90,0.18); }
  .ai-card-menu {
    position: absolute; top: 8px; right: 8px;
    color: var(--text-dim); font-size: 14px; line-height: 1;
    letter-spacing: 1px;
  }
  .ai-card-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .ai-card-head svg { width: 14px; height: 14px; flex-shrink: 0; }
  .ai-card-head .name { font-weight: 600; font-size: 13px; }
  .ai-card-head .time { margin-left: 8px; color: var(--text-dim); font-size: 10.5px; }
  .ai-card-body { color: var(--text-dim); line-height: 1.4; }

  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 8px; }

  /* Assistant overlay — opens from the search bar, styled after kinso's
     mobile mockup (their landing page's phone screenshot): a greeting,
     a one-line "N new / M active" stat, a "Today's briefing" button,
     and an input pinned to the bottom of the card. The stats are real
     (computed from CONVERSATIONS), but the suggestions/input are still
     mock — see the top-of-file header comment. */
  .assistant-backdrop {
    position: fixed; inset: 0; background: rgba(20,20,25,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
  }
  .assistant-panel {
    width: 360px; min-height: 420px;
    background: #fff; border-radius: 18px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.35);
    display: flex; flex-direction: column;
    padding: 22px 20px 16px;
  }
  .assistant-greeting { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
  .assistant-greeting span { color: var(--accent); }
  .assistant-sub { color: var(--text-dim); font-size: 13.5px; line-height: 1.4; margin-bottom: 16px; }
  .assistant-sub b { color: var(--text); font-weight: 700; }
  .briefing-btn {
    align-self: flex-start;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 20px; padding: 7px 14px; font-size: 12.5px; font-weight: 600;
    color: var(--text); cursor: pointer; margin-bottom: 20px;
  }
  .assistant-suggestions { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .assistant-suggestion {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 12.5px; color: var(--text-dim); cursor: pointer;
  }
  .assistant-suggestion:hover { background: var(--panel-2); }
  .assistant-input-row {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 24px;
    padding: 8px 8px 8px 16px; margin-top: 16px;
  }
  .assistant-input-row input {
    flex: 1; border: none; outline: none; font-size: 13px; background: transparent; color: var(--text);
  }
  .assistant-send {
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: var(--text); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .assistant-close {
    align-self: flex-end; margin: -8px -6px 4px auto;
    width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent;
    color: var(--text-dim); font-size: 16px; cursor: pointer;
  }

  /* Message detail panel — opens on clicking a row, near-fullscreen
     (Eva's call — the first pass at 420px was too cramped to read).
     Two columns: message + draft on the left, Context (including the
     network-graph mini-viz) on the right. */
  .detail-panel {
    width: 94vw; height: 90vh;
    background: #fff; border-radius: 18px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.35);
    display: flex; flex-direction: column;
    padding: 28px 32px 24px;
  }
  .detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-shrink: 0; }
  .detail-head .avatar { width: 48px; height: 48px; font-size: 16px; }
  .detail-head .row-name { font-size: 20px; }
  .detail-head .row-time { font-size: 14px; }
  .detail-body { flex: 1; display: flex; gap: 32px; min-height: 0; }
  .detail-col { flex: 1; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .detail-message {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px; font-size: 17px; line-height: 1.55; margin-bottom: 22px;
  }
  .detail-context, .detail-draft { margin-bottom: 22px; }
  .detail-context h3, .detail-draft h3 {
    font-size: 12.5px; letter-spacing: 0.06em; color: var(--text-dim);
    text-transform: uppercase; margin: 0 0 10px;
  }
  .detail-context ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text); line-height: 1.8; }
  .draft-text {
    background: #fff8ef; border: 1px solid #f1dfc2; border-radius: 14px;
    padding: 18px 20px; font-size: 15.5px; line-height: 1.6; margin-bottom: 14px;
  }
  /* Network graph mini-viz — a plain radial layout computed in JS
     (simple trig, no graph library), not a real force-directed sim.
     Center node = this contact, spokes = company/mutual-connection
     nodes pulled from the mock `graph` field. */
  .graph-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-top: 4px;
  }
  .graph-node { cursor: pointer; }
  .graph-node rect { transition: filter 0.1s ease; }
  .graph-node:hover rect { filter: brightness(0.96); }
  .graph-hint { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 4px; }
  .graph-info {
    margin-top: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.5;
    background: #fff; border: 1px solid var(--border); border-radius: 10px; color: var(--text);
  }

  /* Message thread — Eva's call: a single message read as thin and
     purpose-less. Threads show a short multi-turn exchange (the real
     `threads`/`messages` data from /inbox/conversation/<person_key>.json)
     so Context has something real to summarize. */
  .thread { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .thread-msg {
    max-width: 82%; padding: 11px 14px; border-radius: 14px;
    font-size: 14.5px; line-height: 1.5;
  }
  .thread-msg.them { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .thread-msg.you { align-self: flex-end; background: #eaf1ff; border: 1px solid #cfe0fb; border-bottom-right-radius: 4px; }
  .thread-time { font-size: 10.5px; color: var(--text-dim); margin-top: 3px; }
  .thread-msg.you .thread-time { text-align: right; }
  .thread-recipients {
    font-size: 10.5px; color: var(--text-dim); margin-bottom: 4px;
    padding-bottom: 4px; border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  /* One person's messages can span several channels, and within a
     channel (especially email) people often start a new thread rather
     than replying — Eva's ask: stitch it all into one timeline instead
     of showing only the row's own channel/thread. */
  .thread-group { margin-bottom: 20px; }
  .thread-group-head {
    display: flex; align-items: center; gap: 7px; margin-bottom: 10px;
    font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.02em;
  }
  .thread-group-head .chan-icon { width: 14px; height: 14px; display: flex; }
  .thread-group-head .chan-icon svg { width: 100%; height: 100%; }
  .thread-group-head .subject { text-transform: none; font-weight: 500; color: var(--text); letter-spacing: normal; }
</style>

<div class="app">
<div class="rail" id="rail"></div>

<div class="main">
  <div class="searchbar" id="searchbar"><span class="dot"></span> Start typing to ask or search</div>
  <div class="content">
    <div class="list-panel">
      <h2>Inbox</h2>
      <div id="list"></div>
    </div>
    <div class="side-panel">
      <div class="filter-box">
        <h3>Filter by</h3>
        <label><input type="checkbox" id="f-unread"> Unread</label>
        <label><input type="checkbox" id="f-unanswered"> Unanswered</label>
        <label><input type="checkbox" id="f-draft"> Has draft ready</label>
        <h3 class="spaced">Sort by</h3>
        <label><input type="radio" name="sort" id="s-priority" checked> Priority</label>
        <label><input type="radio" name="sort" id="s-recent"> Most recent</label>
      </div>
    </div>
  </div>
</div>
</div>

<script>
// Real brand SVGs (path data from simple-icons), not emoji — emoji glyphs
// render inconsistently across OSes/fonts and weren't recognizable.
// Inlined so this page has no runtime dependency on an external icon CDN
// (it's reached over an SSH tunnel, not the open internet).
const CHANNELS = {
  outlook: {
    label: "Outlook", color: "#0078D4",
    icon: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#0078D4"><path d="M7.88 12.04q0 .45-.11.87-.1.41-.33.74-.22.33-.58.52-.37.2-.87.2t-.85-.2q-.35-.21-.57-.55-.22-.33-.33-.75-.1-.42-.1-.86t.1-.87q.1-.43.34-.76.22-.34.59-.54.36-.2.87-.2t.86.2q.35.21.57.55.22.34.31.77.1.43.1.88zM24 12v9.38q0 .46-.33.8-.33.32-.8.32H7.13q-.46 0-.8-.33-.32-.33-.32-.8V18H1q-.41 0-.7-.3-.3-.29-.3-.7V7q0-.41.3-.7Q.58 6 1 6h6.5V2.55q0-.44.3-.75.3-.3.75-.3h12.9q.44 0 .75.3.3.3.3.75V10.85l1.24.72h.01q.1.07.18.18.07.12.07.25zm-6-8.25v3h3v-3zm0 4.5v3h3v-3zm0 4.5v1.83l3.05-1.83zm-5.25-9v3h3.75v-3zm0 4.5v3h3.75v-3zm0 4.5v2.03l2.41 1.5 1.34-.8v-2.73zM9 3.75V6h2l.13.01.12.04v-2.3zM5.98 15.98q.9 0 1.6-.3.7-.32 1.19-.86.48-.55.73-1.28.25-.74.25-1.61 0-.83-.25-1.55-.24-.71-.71-1.24t-1.15-.83q-.68-.3-1.55-.3-.92 0-1.64.3-.71.3-1.2.85-.5.54-.75 1.3-.25.74-.25 1.63 0 .85.26 1.56.26.72.74 1.23.48.52 1.17.81.69.3 1.56.3zM7.5 21h12.39L12 16.08V17q0 .41-.3.7-.29.3-.7.3H7.5zm15-.13v-7.24l-5.9 3.54Z"/></svg>',
  },
  whatsapp: {
    label: "WhatsApp", color: "#25D366",
    icon: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>',
  },
  linkedin: {
    label: "LinkedIn", color: "#0A66C2",
    icon: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#0A66C2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>',
  },
};
const INBOX_ICON = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H5V5h14v12z"/></svg>';

const AVATAR_COLORS = ["#e8825a", "#6fb98f", "#6f9ceb", "#c77dd1", "#d1b16f", "#7dd1c7"];
function avatarColor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[h];
}
function initials(name) {
  return name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
}

// Real data now — fetched from /inbox/conversations.json (list) and
// /inbox/conversation/<person_key>.json (detail, on click). See
// adapters/inbox_query.py and adapters/ai_brief.py for where this comes
// from. `has_draft` is always false this pass — draft reply generation
// is the next phase, not this one; the badge/filter below stay wired
// but inert until that phase adds a real field to key off.
let CONVERSATIONS = [];

async function loadConversations() {
  const resp = await fetch("/inbox/conversations.json");
  CONVERSATIONS = await resp.json();
  render();
}

function formatRelativeTime(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours}h`;
  return `${Math.floor(hours / 24)}d`;
}

let state = { channel: "all", unread: false, unanswered: false, draft: false, sort: "priority" };

function render() {
  renderRail();
  renderList();
}

function renderRail() {
  const rail = document.getElementById("rail");
  const items = [{ key: "all", icon: INBOX_ICON }, ...Object.entries(CHANNELS).map(([k, v]) => ({ key: k, icon: v.icon }))];
  rail.innerHTML = items.map(it =>
    `<button data-channel="${it.key}" class="${state.channel === it.key ? "active" : ""}">${it.icon}</button>`
  ).join("");
  rail.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => { state.channel = btn.dataset.channel; render(); });
  });
}

function filtered() {
  let rows = CONVERSATIONS.filter(c => state.channel === "all" || c.channel === state.channel);
  if (state.unread) rows = rows.filter(c => c.unread);
  if (state.unanswered) rows = rows.filter(c => c.unanswered);
  if (state.draft) rows = rows.filter(c => c.has_draft);
  rows = rows.slice().sort((a, b) =>
    state.sort === "priority"
      ? b.urgency - a.urgency
      : new Date(b.last_message_at) - new Date(a.last_message_at)
  );
  return rows;
}

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

function renderList() {
  const rows = filtered();
  const list = document.getElementById("list");
  if (rows.length === 0) {
    list.innerHTML = `<div class="empty">Nothing matches this filter.</div>`;
    return;
  }
  list.innerHTML = rows.map(c => `
    <div class="row" data-id="${c.person_key}">
      <div class="avatar" style="background:${avatarColor(c.name)}">${initials(c.name)}</div>
      <div class="row-main">
        <div class="row-top">
          <span class="row-name">${escapeHtml(c.name)}</span>
          <span class="tag" style="background:${avatarColor(c.topic)}22;color:${avatarColor(c.topic)}">${escapeHtml(c.topic)}</span>
          ${c.has_draft ? `<span class="draft-badge" title="AI draft ready">&#9998; Draft ready</span>` : ""}
          <span class="row-time">${formatRelativeTime(c.last_message_at)}</span>
        </div>
        <div class="row-preview">${escapeHtml(c.summary)}</div>
      </div>
      <div class="channel-icon">${CHANNELS[c.channel].icon}</div>
    </div>
  `).join("");
  list.querySelectorAll(".row").forEach(row => {
    row.addEventListener("click", () => openDetail(row.dataset.id));
  });
}

// Detail panel — opens on row click. Message (raw text) + Context
// (real per-contact data: Context/graph/summary/topic all come from the
// precomputed `ai_brief` row for this person — see the file header
// comment above for how that's generated and cached) + an AI draft
// reply when one exists. Same overlay pattern as the assistant panel;
// only one of the two is ever open at a time.
function personKeyForName(name) {
  const found = CONVERSATIONS.find(c => c.name === name);
  return found ? found.person_key : null;
}

// Plain radial layout, computed with trig — NOT a real force-directed
// graph library. Center node = this contact; org + people nodes are
// placed evenly around it, edges labeled with the relationship (not
// just an unlabeled line), nodes are full readable name chips (not
// 2-letter initials — Eva flagged those as confusing) and are clickable:
// a person node that's also a conversation in this inbox re-opens THIS
// panel for them; an org node shows its blurb inline below the graph.
function renderGraph(centerName, graph) {
  const others = [
    ...(graph.org ? [{ label: graph.org.name, kind: "org", blurb: graph.org.blurb, relation: "employer" }] : []),
    ...graph.people.map(p => ({ label: p.name, kind: "person", blurb: "", relation: p.relation })),
  ];
  if (others.length === 0) {
    return `<div class="row-preview" style="padding:20px 4px;">No known company or mutual-connection data for this contact.</div>`;
  }
  const W = 620, H = 380, cx = W / 2, cy = H / 2, r = 150;
  const nodes = others.map((n, i) => {
    const angle = (2 * Math.PI * i) / others.length - Math.PI / 2;
    return { ...n, x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  });
  const color = k => k === "org" ? "#c78b3f" : "#5b6fd6";
  const chipWidth = label => Math.max(76, 30 + label.length * 7.4);
  const edges = nodes.map(n => {
    const mx = (cx + n.x) / 2, my = (cy + n.y) / 2;
    const labelW = n.relation.length * 6.4;
    return `
      <line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="#d8dce2" stroke-width="1.5"/>
      <rect x="${mx - labelW / 2 - 4}" y="${my - 9}" width="${labelW + 8}" height="16" rx="4" fill="var(--panel)"/>
      <text x="${mx}" y="${my + 3}" text-anchor="middle" font-size="10" fill="#7d8590">${escapeHtml(n.relation)}</text>
    `;
  }).join("");
  const nodeEls = nodes.map(n => {
    const w = chipWidth(n.label);
    return `
      <g class="graph-node" data-kind="${n.kind}" data-label="${escapeHtml(n.label)}" data-blurb="${escapeHtml(n.blurb)}">
        <rect x="${n.x - w / 2}" y="${n.y - 19}" width="${w}" height="38" rx="19" fill="${color(n.kind)}18" stroke="${color(n.kind)}" stroke-width="1.5"/>
        <text x="${n.x}" y="${n.y + 5}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${color(n.kind)}">${n.kind === "org" ? "\u{1F3E2}" : "\u{1F464}"} ${escapeHtml(n.label)}</text>
      </g>
    `;
  }).join("");
  const centerW = Math.max(100, 30 + centerName.length * 7.8);
  return `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="340">
      ${edges}
      <rect x="${cx - centerW / 2}" y="${cy - 21}" width="${centerW}" height="42" rx="21" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--accent)">${escapeHtml(centerName)}</text>
      ${nodeEls}
    </svg>
    <div class="graph-hint">Click a node for more, or jump to that person's conversation.</div>
    <div class="graph-info" id="graph-info" hidden></div>
  `;
}

function wireGraphNodes() {
  document.querySelectorAll(".graph-node").forEach(node => {
    node.addEventListener("click", () => {
      const kind = node.dataset.kind, label = node.dataset.label, blurb = node.dataset.blurb;
      if (kind === "person") {
        const targetKey = personKeyForName(label);
        if (targetKey) { openDetail(targetKey); return; }
      }
      const info = document.getElementById("graph-info");
      info.hidden = false;
      info.innerHTML = `<b>${escapeHtml(label)}</b>${blurb ? ` — ${escapeHtml(blurb)}` : " — no further info available."}`;
    });
  });
}

async function openDetail(personKey) {
  const resp = await fetch(`/inbox/conversation/${personKey}.json`);
  if (!resp.ok) return;
  const c = await resp.json();
  closeOverlay();
  const backdrop = document.createElement("div");
  backdrop.className = "assistant-backdrop";
  backdrop.innerHTML = `
    <div class="detail-panel">
      <button class="assistant-close" id="detail-close-btn">&times;</button>
      <div class="detail-head">
        <div class="avatar" style="background:${avatarColor(c.name)}">${initials(c.name)}</div>
        <div>
          <div class="row-name">${escapeHtml(c.name)}</div>
          <div class="row-time">${CHANNELS[c.channel].label} &middot; ${formatRelativeTime(c.last_message_at)}</div>
        </div>
      </div>
      <div class="detail-body">
        <div class="detail-col">
          ${c.threads.map(g => `
            <div class="thread-group">
              <div class="thread-group-head">
                <span class="chan-icon">${CHANNELS[g.channel].icon}</span>
                <span>${CHANNELS[g.channel].label}</span>
                ${g.subject ? `<span class="subject">&middot; ${escapeHtml(g.subject)}</span>` : ""}
              </div>
              <div class="thread">
                ${g.messages.map(m => `
                  <div class="thread-msg ${m.sender}">
                    ${(m.to.length || m.cc.length) ? `
                      <div class="thread-recipients">
                        ${m.to.length ? `To: ${m.to.map(escapeHtml).join(", ")}` : ""}
                        ${m.cc.length ? `${m.to.length ? " &middot; " : ""}Cc: ${m.cc.map(escapeHtml).join(", ")}` : ""}
                      </div>
                    ` : ""}
                    <div>${escapeHtml(m.text)}</div>
                    <div class="thread-time">${formatRelativeTime(m.sent_at)}</div>
                  </div>
                `).join("")}
              </div>
            </div>
          `).join("")}
          <div class="detail-draft">
            <h3>&#9998; AI draft reply</h3>
            <div class="row-preview">Draft replies — under development.</div>
          </div>
        </div>
        <div class="detail-col">
          <div class="detail-context">
            <h3>Context</h3>
            <ul>${c.context.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>
          </div>
          <div class="detail-context">
            <h3>Network</h3>
            <div class="graph-box">${renderGraph(c.name, c.graph)}</div>
          </div>
        </div>
      </div>
    </div>
  `;
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeOverlay(); });
  document.body.appendChild(backdrop);
  document.getElementById("detail-close-btn").addEventListener("click", closeOverlay);
  wireGraphNodes();

  fetch(`/inbox/conversation/${personKey}/read`, { method: "POST" });
  const row = CONVERSATIONS.find(x => x.person_key === personKey);
  if (row) row.unread = false;
  renderList();
}

document.getElementById("f-unread").addEventListener("change", e => { state.unread = e.target.checked; render(); });
document.getElementById("f-unanswered").addEventListener("change", e => { state.unanswered = e.target.checked; render(); });
document.getElementById("s-priority").addEventListener("change", () => { state.sort = "priority"; render(); });
document.getElementById("s-recent").addEventListener("change", () => { state.sort = "recent"; render(); });

// Assistant overlay — opens on clicking the search bar. The greeting
// stats are computed from real CONVERSATIONS data; the suggestions and
// input still do nothing real when submitted (see file header).
const ASSISTANT_SUGGESTIONS = [
  "What's most urgent right now?",
  "Who's waiting on a reply from me?",
  "Summarize this week's WhatsApp activity",
];

function openAssistant() {
  closeOverlay();
  const unread = CONVERSATIONS.filter(c => c.unread).length;
  const active = CONVERSATIONS.filter(c => c.unanswered).length;
  const backdrop = document.createElement("div");
  backdrop.className = "assistant-backdrop";
  backdrop.innerHTML = `
    <div class="assistant-panel">
      <button class="assistant-close" id="assistant-close-btn">&times;</button>
      <div class="assistant-greeting">Good morning<span>.</span></div>
      <div class="assistant-sub">You've got <b>${unread} new</b> and <b>${active} active</b> conversations.</div>
      <button class="briefing-btn" type="button">Today's briefing &rsaquo;</button>
      <div class="assistant-suggestions">
        ${ASSISTANT_SUGGESTIONS.map(s => `<div class="assistant-suggestion">${escapeHtml(s)}</div>`).join("")}
      </div>
      <div class="assistant-input-row">
        <input type="text" placeholder="Ask anything..." disabled>
        <button class="assistant-send" type="button">&uarr;</button>
      </div>
    </div>
  `;
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeOverlay(); });
  document.body.appendChild(backdrop);
  document.getElementById("assistant-close-btn").addEventListener("click", closeOverlay);
}

function closeOverlay() {
  const el = document.querySelector(".assistant-backdrop");
  if (el) el.remove();
}

document.getElementById("searchbar").addEventListener("click", openAssistant);
document.getElementById("f-draft").addEventListener("change", e => { state.draft = e.target.checked; render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOverlay(); });

loadConversations();
</script>
