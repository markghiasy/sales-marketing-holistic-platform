<!--
  Unified inbox prototype — built 2026-09-14 for a same-day demo to Mark,
  inspired by kinso.ai's UI (Eva and Mark's Phase 2 design reference for
  a single interface over the three adapters: Outlook/WhatsApp/LinkedIn).

  Redesigned same day, still same session: Eva pointed out the original
  right-side "AI suggestion card" panel duplicated what the list preview
  already showed once the preview text was written to read like a real
  summary — so that panel is gone. In its place: clicking a row opens a
  detail panel (raw message + Context + an AI draft reply when one
  exists), and rows with a ready draft get a small badge in the list, so
  "is there something to act on" is visible without opening anything.

  DELIBERATELY MOCK DATA ONLY, nothing below is a real integration:
    - Conversations, topic tags, `context` bullets, and `draft` replies
      are all hardcoded in MOCK_CONVERSATIONS below — not read from the
      real `message`/`identity`/`fact` tables. `context` is meant to
      stand in for what identity resolution + the fact table already
      extract for real (company/title, last contact, shared history,
      mutual connections) — this pass just hand-writes plausible values,
      doesn't query them.
    - Draft replies are pre-written text, not a real Anthropic API call
      (ANTHROPIC_API_KEY exists as of today, but wiring this up to a
      real model call is future work, not this pass). "Use this draft"
      does nothing.
    - Filter/sort (Unread/Unanswered/Has draft ready, Priority/Most
      Recent) run client-side over the mock array — no backend query.
    - Left icon rail's channel filter is the same idea as kinso's
      "Accounts" panel, collapsed into one control since this project
      has exactly three channels, not multiple accounts per channel.

  Explicitly NOT built in this pass, noted for later:
    - Real data: this UI reading from adapters' actual synced messages,
      and Context reading from real identity/fact rows instead of a
      hand-written array.
    - Real LLM call producing draft replies and the topic tags.
    - A network-graph / node visualization in the Context section —
      Eva asked for this, cut for time (this pass built in ~30min before
      a demo); Context is a plain bullet list instead. Worth a real
      pass once there's time to pick a rendering approach.
    - The top search bar's real semantic search (visual only below).
    - Actually sending a reply — "Use this draft" is a dead button.
-->
<title>Inbox</title>
<style>
  :root {
    /* Light app theme — matches kinso's actual product screenshot
       (their marketing SITE is dark, but the app mockup inside it is
       light/white). */
    --bg: #ffffff;
    --panel: #f7f8fa;
    --panel-2: #eef0f3;
    --border: #e5e8ec;
    --text: #1c1f23;
    --text-dim: #7d8590;
    --accent: #e8825a;
    --accent-2: #3d9e6f;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app { height: 100vh; display: flex; min-height: 0; }

  /* left icon rail */
  .rail {
    width: 56px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 10px;
    flex-shrink: 0;
  }
  .rail button {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .rail button svg { width: 18px; height: 18px; }
  .rail button:not(.active) svg[fill]:not([fill="currentColor"]) { opacity: 0.55; filter: grayscale(1); }
  .rail button.active {
    background: var(--panel-2);
    border-color: var(--border);
    color: var(--accent);
  }

  /* main column */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .searchbar {
    margin: 16px 20px 8px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: text;
    color: var(--text-dim);
    font-size: 13px;
    display: flex; align-items: center; gap: 8px;
  }
  .searchbar .dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    flex-shrink: 0;
  }
  .content { flex: 1; display: flex; overflow: hidden; padding: 0 20px 20px; gap: 16px; }

  .list-panel { flex: 1; min-width: 0; overflow-y: auto; }
  .list-panel h2 { font-size: 15px; margin: 4px 0 12px; color: var(--text); }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .row:hover { background: var(--panel); }
  .draft-badge {
    background: #eef6ff; color: #2f6fb2; border: 1px solid #cfe4fb;
    font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 20px;
    white-space: nowrap;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: #fff;
    flex-shrink: 0;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-top { display: flex; align-items: baseline; gap: 8px; }
  .row-name { font-weight: 600; font-size: 13.5px; }
  .row-time { font-size: 11px; color: var(--text-dim); margin-left: auto; }
  .row-preview { font-size: 12.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 20px;
    font-size: 10.5px; font-weight: 600; margin-right: 6px;
    white-space: nowrap;
  }
  .channel-icon { flex-shrink: 0; display: flex; }
  .channel-icon svg { width: 15px; height: 15px; }

  /* right filter + AI panel */
  .side-panel { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; overflow-x: hidden; }
  .filter-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px;
  }
  .filter-box h3 { font-size: 10.5px; letter-spacing: 0.06em; color: var(--text-dim); margin: 0 0 8px; text-transform: uppercase; }
  .filter-box h3.spaced { margin-top: 14px; }
  .filter-box label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; cursor: pointer; }

  /* Cascading/staggered stack, like kinso's floating suggestion cards —
     each card nudged right + slightly rotated instead of a plain flush
     vertical list, with a real shadow so they read as "floating". */
  .ai-cards { display: flex; flex-direction: column; gap: 14px; padding: 2px 4px 2px 0; }
  .ai-card {
    position: relative;
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 26px 12px 12px; font-size: 12.5px;
    box-shadow: 0 6px 16px rgba(20,20,30,0.08);
    transition: transform 0.15s ease;
  }
  .ai-card:nth-child(1) { transform: rotate(0deg) translateX(0); }
  .ai-card:nth-child(2) { transform: rotate(0.6deg) translateX(8px); }
  .ai-card:nth-child(3) { transform: rotate(-0.5deg) translateX(14px); }
  .ai-card:hover { transform: translateX(0) rotate(0deg); }
  .ai-card.top { border-color: var(--accent); border-left-width: 3px; box-shadow: 0 8px 20px rgba(232,130,90,0.18); }
  .ai-card-menu {
    position: absolute; top: 8px; right: 8px;
    color: var(--text-dim); font-size: 14px; line-height: 1;
    letter-spacing: 1px;
  }
  .ai-card-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .ai-card-head svg { width: 14px; height: 14px; flex-shrink: 0; }
  .ai-card-head .name { font-weight: 600; font-size: 13px; }
  .ai-card-head .time { margin-left: 8px; color: var(--text-dim); font-size: 10.5px; }
  .ai-card-body { color: var(--text-dim); line-height: 1.4; }

  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 8px; }

  /* Assistant overlay — opens from the search bar, styled after kinso's
     mobile mockup (their landing page's phone screenshot): a greeting,
     a one-line "N new / M active" stat, a "Today's briefing" button,
     and an input pinned to the bottom of the card. Mock only — the
     stats are computed from MOCK_CONVERSATIONS, nothing is a real
     assistant response. */
  .assistant-backdrop {
    position: fixed; inset: 0; background: rgba(20,20,25,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
  }
  .assistant-panel {
    width: 360px; min-height: 420px;
    background: #fff; border-radius: 18px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.35);
    display: flex; flex-direction: column;
    padding: 22px 20px 16px;
  }
  .assistant-greeting { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
  .assistant-greeting span { color: var(--accent); }
  .assistant-sub { color: var(--text-dim); font-size: 13.5px; line-height: 1.4; margin-bottom: 16px; }
  .assistant-sub b { color: var(--text); font-weight: 700; }
  .briefing-btn {
    align-self: flex-start;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 20px; padding: 7px 14px; font-size: 12.5px; font-weight: 600;
    color: var(--text); cursor: pointer; margin-bottom: 20px;
  }
  .assistant-suggestions { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .assistant-suggestion {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 12.5px; color: var(--text-dim); cursor: pointer;
  }
  .assistant-suggestion:hover { background: var(--panel-2); }
  .assistant-input-row {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 24px;
    padding: 8px 8px 8px 16px; margin-top: 16px;
  }
  .assistant-input-row input {
    flex: 1; border: none; outline: none; font-size: 13px; background: transparent; color: var(--text);
  }
  .assistant-send {
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: var(--text); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .assistant-close {
    align-self: flex-end; margin: -8px -6px 4px auto;
    width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent;
    color: var(--text-dim); font-size: 16px; cursor: pointer;
  }

  /* Message detail panel — opens on clicking a row. Real message text,
     a Context section (mock identity/relationship info — see this
     file's header comment on where real data would plug in), and an
     AI draft reply when one exists. */
  .detail-panel {
    width: 420px; max-height: 82vh; overflow-y: auto;
    background: #fff; border-radius: 18px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.35);
    display: flex; flex-direction: column;
    padding: 22px 22px 20px;
  }
  .detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .detail-message {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.5; margin-bottom: 16px;
  }
  .detail-context, .detail-draft { margin-bottom: 16px; }
  .detail-context h3, .detail-draft h3 {
    font-size: 10.5px; letter-spacing: 0.06em; color: var(--text-dim);
    text-transform: uppercase; margin: 0 0 8px;
  }
  .detail-context ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--text); line-height: 1.6; }
  .draft-text {
    background: #fff8ef; border: 1px solid #f1dfc2; border-radius: 12px;
    padding: 12px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 10px;
  }
</style>

<div class="app">
<div class="rail" id="rail"></div>

<div class="main">
  <div class="searchbar" id="searchbar"><span class="dot"></span> Start typing to ask or search</div>
  <div class="content">
    <div class="list-panel">
      <h2>Inbox</h2>
      <div id="list"></div>
    </div>
    <div class="side-panel">
      <div class="filter-box">
        <h3>Filter by</h3>
        <label><input type="checkbox" id="f-unread"> Unread</label>
        <label><input type="checkbox" id="f-unanswered"> Unanswered</label>
        <label><input type="checkbox" id="f-draft"> Has draft ready</label>
        <h3 class="spaced">Sort by</h3>
        <label><input type="radio" name="sort" id="s-priority" checked> Priority</label>
        <label><input type="radio" name="sort" id="s-recent"> Most recent</label>
      </div>
    </div>
  </div>
</div>
</div>

<script>
// Mock data only — see the file header comment. Nothing here is read
// from a real adapter/message/fact table.
// Real brand SVGs (path data from simple-icons), not emoji — emoji glyphs
// render inconsistently across OSes/fonts and weren't recognizable.
// Inlined so this page has no runtime dependency on an external icon CDN
// (it's reached over an SSH tunnel, not the open internet).
const CHANNELS = {
  outlook: {
    label: "Outlook", color: "#0078D4",
    icon: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#0078D4"><path d="M7.88 12.04q0 .45-.11.87-.1.41-.33.74-.22.33-.58.52-.37.2-.87.2t-.85-.2q-.35-.21-.57-.55-.22-.33-.33-.75-.1-.42-.1-.86t.1-.87q.1-.43.34-.76.22-.34.59-.54.36-.2.87-.2t.86.2q.35.21.57.55.22.34.31.77.1.43.1.88zM24 12v9.38q0 .46-.33.8-.33.32-.8.32H7.13q-.46 0-.8-.33-.32-.33-.32-.8V18H1q-.41 0-.7-.3-.3-.29-.3-.7V7q0-.41.3-.7Q.58 6 1 6h6.5V2.55q0-.44.3-.75.3-.3.75-.3h12.9q.44 0 .75.3.3.3.3.75V10.85l1.24.72h.01q.1.07.18.18.07.12.07.25zm-6-8.25v3h3v-3zm0 4.5v3h3v-3zm0 4.5v1.83l3.05-1.83zm-5.25-9v3h3.75v-3zm0 4.5v3h3.75v-3zm0 4.5v2.03l2.41 1.5 1.34-.8v-2.73zM9 3.75V6h2l.13.01.12.04v-2.3zM5.98 15.98q.9 0 1.6-.3.7-.32 1.19-.86.48-.55.73-1.28.25-.74.25-1.61 0-.83-.25-1.55-.24-.71-.71-1.24t-1.15-.83q-.68-.3-1.55-.3-.92 0-1.64.3-.71.3-1.2.85-.5.54-.75 1.3-.25.74-.25 1.63 0 .85.26 1.56.26.72.74 1.23.48.52 1.17.81.69.3 1.56.3zM7.5 21h12.39L12 16.08V17q0 .41-.3.7-.29.3-.7.3H7.5zm15-.13v-7.24l-5.9 3.54Z"/></svg>',
  },
  whatsapp: {
    label: "WhatsApp", color: "#25D366",
    icon: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>',
  },
  linkedin: {
    label: "LinkedIn", color: "#0A66C2",
    icon: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#0A66C2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>',
  },
};
const INBOX_ICON = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H5V5h14v12z"/></svg>';

const AVATAR_COLORS = ["#e8825a", "#6fb98f", "#6f9ceb", "#c77dd1", "#d1b16f", "#7dd1c7"];
function avatarColor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[h];
}
function initials(name) {
  return name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
}

// `message` is the raw excerpt (what they actually wrote, first person) —
// shown in the list AND at the top of the detail panel. `context` is a
// short list of the kind of thing identity resolution + the fact table
// already extract for real (company/title, last contact, shared
// history) — mocked here as plain strings, not an actual graph query.
// `draft` is a pre-written AI reply, null when none exists yet.
const MOCK_CONVERSATIONS = [
  { id: 1, name: "Priya Nandakumar", channel: "outlook", time: "12m", priority: 3, unread: true, unanswered: true,
    tag: { text: "Contract Request", color: "#5b6fd6" },
    message: "Hi — could you send over the services agreement with the updated pricing? Need it before Friday if possible, we're trying to close this out this week.",
    context: ["VP Partnerships @ Brightstone Realty", "Last contact: 2 weeks ago (intro call)", "3 prior email threads, no WhatsApp/LinkedIn overlap yet"],
    draft: "Hi Priya — attaching the updated services agreement now, pricing reflects the terms we discussed. Let me know if Friday still works or if you need it sooner." },
  { id: 2, name: "Marcus Wetherby", channel: "whatsapp", time: "38m", priority: 2, unread: true, unanswered: true,
    tag: { text: "Scheduling", color: "#3d8f63" },
    message: "hey, can we push our call to thursday afternoon instead of wednesday? something came up on my end",
    context: ["Ops Lead @ Fenwick & Co", "Last contact: yesterday (WhatsApp)", "Recurring biweekly check-in"],
    draft: null },
  { id: 3, name: "Odalys Ferreira", channel: "linkedin", time: "1h", priority: 2, unread: false, unanswered: true,
    tag: { text: "Intro Request", color: "#a35bc7" },
    message: "Following up on the intro to your product lead — happy to send over a one-pager first if that makes it easier to forward along.",
    context: ["Founder @ Solace Health", "Connected via mutual: Tomasz Kaczmarek", "No prior direct contact"],
    draft: "Hi Odalys — happy to make the intro. Send the one-pager over and I'll forward it along with some context." },
  { id: 4, name: "Dae-Ho Lim", channel: "outlook", time: "3h", priority: 1, unread: false, unanswered: false,
    tag: { text: "Invoice", color: "#c78b3f" },
    message: "Confirming invoice #4471 was received on our end and is scheduled for payment next week.",
    context: ["Finance @ Lumen Partners", "Last contact: 3 days ago", "8 prior threads — long-standing vendor relationship"],
    draft: null },
  { id: 5, name: "Ingrid Solberg", channel: "whatsapp", time: "5h", priority: 1, unread: false, unanswered: false,
    tag: { text: "Team Update", color: "#3d8f63" },
    message: "Shared this week's progress notes and a rough plan for next sprint in the doc — take a look when you get a chance.",
    context: ["Teammate", "Last contact: today, earlier", "Daily WhatsApp thread"],
    draft: null },
  { id: 6, name: "Tomasz Kaczmarek", channel: "linkedin", time: "1d", priority: 3, unread: false, unanswered: true,
    tag: { text: "Networking", color: "#a35bc7" },
    message: "Great meeting you at the conference last week — would love to stay in touch and hear how things are going.",
    context: ["Partner @ Meridian Ventures", "Met in person: SaaStr conference, last week", "Mutual connection: Odalys Ferreira"],
    draft: "Great to meet you too, Tomasz! Would love to stay in touch — let me know if you're ever up for a coffee chat." },
];

let state = { channel: "all", unread: false, unanswered: false, draft: false, sort: "priority" };

function render() {
  renderRail();
  renderList();
}

function renderRail() {
  const rail = document.getElementById("rail");
  const items = [{ key: "all", icon: INBOX_ICON }, ...Object.entries(CHANNELS).map(([k, v]) => ({ key: k, icon: v.icon }))];
  rail.innerHTML = items.map(it =>
    `<button data-channel="${it.key}" class="${state.channel === it.key ? "active" : ""}">${it.icon}</button>`
  ).join("");
  rail.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => { state.channel = btn.dataset.channel; render(); });
  });
}

function filtered() {
  let rows = MOCK_CONVERSATIONS.filter(c => state.channel === "all" || c.channel === state.channel);
  if (state.unread) rows = rows.filter(c => c.unread);
  if (state.unanswered) rows = rows.filter(c => c.unanswered);
  if (state.draft) rows = rows.filter(c => c.draft);
  // Real bug found by Eva 2026-09-14: this used to sort "Most recent" by
  // b.id - a.id (descending id), but ids are assigned in the same order
  // as MOCK_CONVERSATIONS' `time` field — 1 is the newest (12m), 6 the
  // oldest (1d) — so descending id put the OLDEST conversation first,
  // the opposite of what "Most recent" means. Ascending id (a.id - b.id)
  // is correct here.
  rows = rows.slice().sort((a, b) => state.sort === "priority" ? b.priority - a.priority : a.id - b.id);
  return rows;
}

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

function renderList() {
  const rows = filtered();
  const list = document.getElementById("list");
  if (rows.length === 0) {
    list.innerHTML = `<div class="empty">Nothing matches this filter.</div>`;
    return;
  }
  list.innerHTML = rows.map(c => `
    <div class="row" data-id="${c.id}">
      <div class="avatar" style="background:${avatarColor(c.name)}">${initials(c.name)}</div>
      <div class="row-main">
        <div class="row-top">
          <span class="row-name">${escapeHtml(c.name)}</span>
          <span class="tag" style="background:${c.tag.color}22;color:${c.tag.color}">${escapeHtml(c.tag.text)}</span>
          ${c.draft ? `<span class="draft-badge" title="AI draft ready">&#9998; Draft ready</span>` : ""}
          <span class="row-time">${c.time}</span>
        </div>
        <div class="row-preview">${escapeHtml(c.message)}</div>
      </div>
      <div class="channel-icon">${CHANNELS[c.channel].icon}</div>
    </div>
  `).join("");
  list.querySelectorAll(".row").forEach(row => {
    row.addEventListener("click", () => openDetail(Number(row.dataset.id)));
  });
}

// Detail panel — opens on row click. Message (raw text) + Context
// (mock identity/relationship info — this is where a real build would
// surface adapters.resolution's actual identity/fact data) + an AI
// draft reply when one exists. Same overlay pattern as the assistant
// panel; only one of the two is ever open at a time.
function openDetail(id) {
  const c = MOCK_CONVERSATIONS.find(x => x.id === id);
  if (!c) return;
  closeOverlay();
  const backdrop = document.createElement("div");
  backdrop.className = "assistant-backdrop";
  backdrop.innerHTML = `
    <div class="detail-panel">
      <button class="assistant-close" id="detail-close-btn">&times;</button>
      <div class="detail-head">
        <div class="avatar" style="background:${avatarColor(c.name)}">${initials(c.name)}</div>
        <div>
          <div class="row-name">${escapeHtml(c.name)}</div>
          <div class="row-time">${CHANNELS[c.channel].label} &middot; ${c.time}</div>
        </div>
      </div>
      <div class="detail-message">${escapeHtml(c.message)}</div>
      <div class="detail-context">
        <h3>Context</h3>
        <ul>${c.context.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>
      </div>
      ${c.draft ? `
        <div class="detail-draft">
          <h3>&#9998; AI draft reply</h3>
          <div class="draft-text">${escapeHtml(c.draft)}</div>
          <button class="briefing-btn" type="button">Use this draft &rsaquo;</button>
        </div>
      ` : `<div class="detail-context"><h3>&#9998; AI draft reply</h3><div class="row-preview">No draft yet.</div></div>`}
    </div>
  `;
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeOverlay(); });
  document.body.appendChild(backdrop);
  document.getElementById("detail-close-btn").addEventListener("click", closeOverlay);
}

document.getElementById("f-unread").addEventListener("change", e => { state.unread = e.target.checked; render(); });
document.getElementById("f-unanswered").addEventListener("change", e => { state.unanswered = e.target.checked; render(); });
document.getElementById("s-priority").addEventListener("change", () => { state.sort = "priority"; render(); });
document.getElementById("s-recent").addEventListener("change", () => { state.sort = "recent"; render(); });

// Assistant overlay — opens on clicking the search bar. Mock only: the
// greeting stats are computed from MOCK_CONVERSATIONS, the suggestions
// and input do nothing real when submitted (see file header).
const ASSISTANT_SUGGESTIONS = [
  "What's most urgent right now?",
  "Who's waiting on a reply from me?",
  "Summarize this week's WhatsApp activity",
];

function openAssistant() {
  closeOverlay();
  const unread = MOCK_CONVERSATIONS.filter(c => c.unread).length;
  const active = MOCK_CONVERSATIONS.filter(c => c.unanswered).length;
  const backdrop = document.createElement("div");
  backdrop.className = "assistant-backdrop";
  backdrop.innerHTML = `
    <div class="assistant-panel">
      <button class="assistant-close" id="assistant-close-btn">&times;</button>
      <div class="assistant-greeting">Good morning<span>.</span></div>
      <div class="assistant-sub">You've got <b>${unread} new</b> and <b>${active} active</b> conversations.</div>
      <button class="briefing-btn" type="button">Today's briefing &rsaquo;</button>
      <div class="assistant-suggestions">
        ${ASSISTANT_SUGGESTIONS.map(s => `<div class="assistant-suggestion">${escapeHtml(s)}</div>`).join("")}
      </div>
      <div class="assistant-input-row">
        <input type="text" placeholder="Ask anything..." disabled>
        <button class="assistant-send" type="button">&uarr;</button>
      </div>
    </div>
  `;
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeOverlay(); });
  document.body.appendChild(backdrop);
  document.getElementById("assistant-close-btn").addEventListener("click", closeOverlay);
}

function closeOverlay() {
  const el = document.querySelector(".assistant-backdrop");
  if (el) el.remove();
}

document.getElementById("searchbar").addEventListener("click", openAssistant);
document.getElementById("f-draft").addEventListener("change", e => { state.draft = e.target.checked; render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOverlay(); });

render();
</script>
