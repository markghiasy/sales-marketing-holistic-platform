<!DOCTYPE html>
<html>
<head>
  <title>Comms Platform — Review Queue</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    .item { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .item .score { font-weight: 600; color: #a8791f; }
    .item .reason { color: #4c525d; margin: 8px 0; }
    .item .names { font-size: 1.1em; margin-bottom: 4px; }
    button { padding: 6px 14px; margin-right: 8px; cursor: pointer; }
    .confirm { background: #e2f1e8; border: 1px solid #2f8f5b; }
    .reject { background: #f7e5e3; border: 1px solid #b1453c; }
  </style>
</head>
<body>
  <h1>Review queue</h1>
  <p>Pending identity matches and knowledge-graph facts — confirm the ones that are right, reject the ones that aren't.</p>

  <h2>Identity matches</h2>
  <div id="candidates">Loading…</div>

  <h2>Facts</h2>
  <div id="facts">Loading…</div>

<script>
// Candidate/fact fields (display names, reasons, LinkedIn/company names)
// come from external, uncontrolled parties — anyone who messages or
// connects with the account being onboarded controls their own display
// name. Building these onto the page via innerHTML with unescaped
// interpolation would be stored XSS: a WhatsApp/LinkedIn contact named
// e.g. "<img src=x onerror=...>" would execute in the browser of
// whoever opens this page. escapeHtml() below is applied to every
// dynamic text value before it goes into the template string.
// Unrelated but equally real: item.id is a UUID *string* (Flask
// jsonify serialises it that way) — interpolating it unquoted into an
// inline onclick="..." attribute produces invalid JS (UUIDs contain
// hyphens, which JS parses as subtraction), silently breaking every
// confirm/reject button. Using data-* attributes + addEventListener
// instead of onclick sidesteps both problems at once: no HTML-context
// interpolation of untrusted text, and no JS-context interpolation of
// the id at all.
function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

function wireActions(container) {
  container.querySelectorAll("button[data-kind]").forEach(btn => {
    btn.addEventListener("click", () => act(btn.dataset.kind, btn.dataset.id, btn.dataset.action));
  });
}

async function loadCandidates() {
  const resp = await fetch("/resolution/candidates.json");
  const items = await resp.json();
  const container = document.getElementById("candidates");
  if (items.length === 0) {
    container.textContent = "Nothing pending.";
    return;
  }
  container.innerHTML = items.map(item => `
    <div class="item">
      <div class="names">${escapeHtml(item.name_a)} (${escapeHtml(item.channel_a)}) &harr; ${escapeHtml(item.name_b)} (${escapeHtml(item.channel_b)})</div>
      <div class="score">score ${item.score.toFixed(2)} — ${escapeHtml(item.method)}</div>
      <div class="reason">${escapeHtml(item.reason || "")}</div>
      <button class="confirm" data-kind="candidate" data-id="${item.id}" data-action="confirm">Confirm — same person</button>
      <button class="reject" data-kind="candidate" data-id="${item.id}" data-action="reject">Reject — different people</button>
    </div>
  `).join("");
  wireActions(container);
}

async function loadFacts() {
  const resp = await fetch("/resolution/facts.json");
  const items = await resp.json();
  const container = document.getElementById("facts");
  if (items.length === 0) {
    container.textContent = "Nothing pending.";
    return;
  }
  container.innerHTML = items.map(item => `
    <div class="item">
      <div class="names">${escapeHtml(item.subject_name)} — ${escapeHtml(item.fact_type)} — ${escapeHtml(item.object_display)}</div>
      <div class="score">confidence ${item.confidence.toFixed(2)} — ${escapeHtml(item.source)}</div>
      <div class="reason">${escapeHtml(item.reason || "")}</div>
      <button class="confirm" data-kind="fact" data-id="${item.id}" data-action="confirm">Confirm</button>
      <button class="reject" data-kind="fact" data-id="${item.id}" data-action="reject">Reject</button>
    </div>
  `).join("");
  wireActions(container);
}

async function act(kind, id, action) {
  await fetch(`/resolution/${kind}/${id}/${action}`, { method: "POST" });
  loadCandidates();
  loadFacts();
}

loadCandidates();
loadFacts();
</script>
</body>
</html>
