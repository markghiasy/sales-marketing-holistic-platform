[project]
name = "comms-outreach-platform"
version = "0.1.0"
description = "Comms & Outreach Platform — MVP 1.0 (Block A: Outlook adapter + store)"
requires-python = ">=3.11"
dependencies = [
    "msal>=1.28",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "playwright>=1.47",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adapters*"]
