services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comms}
      POSTGRES_DB: ${POSTGRES_DB:-comms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comms}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
